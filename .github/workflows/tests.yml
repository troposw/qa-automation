name: Weekly Cross-Browser Tests

on:
  schedule:
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python Deps
        run: pip install -r requirements.txt

      - name: Run API Tests
        run: pytest tests/api -n auto --alluredir=allure-results
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload API Results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: allure-results-api
          path: allure-results
          retention-days: 1

  ui-tests:
    name: UI Tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python Deps
        run: pip install -r requirements.txt

      - name: Run UI Tests
        run: pytest tests/ui -n auto --browser=${{ matrix.browser }} --alluredir=allure-results
        env:
          PYTHONPATH: ${{ github.workspace }}
          HEADLESS: true

      - name: Upload UI Results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: allure-results-ui-${{ matrix.browser }}
          path: allure-results
          retention-days: 1

  report:
    name: Generate Allure 3 Report
    needs: [api-tests, ui-tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Download All Results
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Get History from GitHub Pages
        uses: actions/checkout@v6.0.2
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Restore History
        run: |
          mkdir -p allure-results/history
          if [ -d "gh-pages-dir/history" ]; then
            cp -r gh-pages-dir/history/* allure-results/history/
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Allure 3
        run: npm ci

      - name: Generate Report
        run: npm run allure:awesome

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
